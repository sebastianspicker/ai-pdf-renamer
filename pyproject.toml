[build-system]
requires = ["hatchling>=1.27.1"]
build-backend = "hatchling.build"

[project]
name = "folionym"
dynamic = ["version"]
description = "Local-first PDF naming with deterministic heuristics, OCR, and optional HTTP LLM enrichment."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [{ name = "sebastian" }]
keywords = ["pdf", "file-renaming", "local-llm", "ocr", "textual"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "PyYAML>=6.0.0",
  "cryptography>=50.0.0",
  "requests>=2.33.0",
  "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/sebastianspicker/folionym#readme"
Source = "https://github.com/sebastianspicker/folionym"
Issues = "https://github.com/sebastianspicker/folionym/issues"
Changelog = "https://github.com/sebastianspicker/folionym/blob/main/CHANGELOG.md"
Security = "https://github.com/sebastianspicker/folionym/security/policy"
Documentation = "https://github.com/sebastianspicker/folionym/tree/main/docs"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "types-requests>=2.32.0",
  "types-PyYAML>=6.0.0",
]
pdf = [
  "pymupdf>=1.23.0",
]
tokens = [
  "tiktoken>=0.5.0",
]
ocr = [
  "ocrmypdf>=14.0.0",
]
tui = [
  "textual>=0.40.0",
]
web = [
  "fastapi>=0.139.2,<1",
  "pymupdf>=1.23.0",
  "uvicorn>=0.51.0,<1",
]

[project.scripts]
folionym = "folionym.cli:main"
folionym-tui = "folionym.tui:main"
folionym-undo = "folionym.undo_cli:main"
folionym-web = "folionym.web_cli:main"

[tool.hatch.version]
path = "src/folionym/__init__.py"

[tool.hatch.build.targets.sdist]
# Build isolation may omit `.git`, so VCS ignores are not a safe release boundary.
include = [
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/DESIGN.md",
  "/LICENSE",
  "/Makefile",
  "/PRODUCT.md",
  "/README.md",
  "/RELEASING.md",
  "/SECURITY.md",
  "/docs/README.md",
  "/docs/frontend.md",
  "/docs/releases",
  "/docs/tui.md",
  "/frontend",
  "/pyproject.toml",
  "/scripts/repository_hygiene.py",
  "/scripts/verify_distributions.py",
  "/src/folionym",
  "/tests",
  "/uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/folionym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "UP", "S", "PT", "SIM", "RUF"]
ignore = [
  # Allow explicit exception chaining omissions in a small codebase.
  "B904",
  # subprocess/exec: flagged in CLI tool code that needs it.
  "S603", "S607",
  # assert in tests is fine.
  "S101",
  # Hardcoded password/token bindings: false positives on config field names.
  "S105", "S106",
  # Ambiguous unicode characters: intentional German text (umlauts etc.).
  "RUF001", "RUF002",
  # Composite assertions in tests: not worth splitting.
  "PT018",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  # Tests legitimately use subprocess, hardcoded paths, non-random, etc.
  "S", "PT011",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true
explicit_package_bases = true
mypy_path = ["src"]
exclude = ["^tests/"]
# Optional deps not always installed in CI or dev environments.
[[tool.mypy.overrides]]
module = ["fitz", "tiktoken", "ocrmypdf", "textual", "textual.*", "rich", "rich.*"]
ignore_missing_imports = true
# TUI module depends on optional, untyped textual; relax checks that fire on Any base classes/decorators.
[[tool.mypy.overrides]]
module = ["folionym.tui"]
disallow_subclassing_any = false
disallow_untyped_decorators = false
